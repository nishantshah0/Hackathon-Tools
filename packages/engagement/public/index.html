<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement — who's going dark</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #21262d;
    --text: #e6edf3;
    --muted: #8b949e;
    --active: #3fb950;
    --cooling: #d29922;
    --dark: #f85149;
    --new: #6e7681;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .totals { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 3px 11px; border-radius: 999px;
    border: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  .pill b { color: var(--text); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  .conn .dot { margin-right: 6px; }
  #alerts {
    padding: 8px 22px 0; display: flex; flex-direction: column; gap: 4px;
  }
  .alert {
    font-size: 12.5px; color: var(--muted);
    border-left: 3px solid var(--dark); padding: 4px 10px;
    background: var(--panel); border-radius: 0 6px 6px 0;
  }
  .alert b { color: var(--text); }
  main {
    display: grid; gap: 14px; padding: 18px 22px 40px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--new);
    border-radius: 10px;
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; gap: 10px;
    transition: border-color .3s;
  }
  .card.active  { border-left-color: var(--active); }
  .card.cooling { border-left-color: var(--cooling); }
  .card.dark    { border-left-color: var(--dark); }
  .card.new     { border-left-color: var(--new); }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .team-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
  .active  .status-tag { color: var(--active); }
  .cooling .status-tag { color: var(--cooling); }
  .dark    .status-tag { color: var(--dark); }
  .new     .status-tag { color: var(--new); }
  .score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .score { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .score small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .spark { flex: 1; max-width: 130px; }
  .spark svg { display: block; width: 100%; height: 34px; }
  .signals { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
  .signals .sig { display: flex; justify-content: space-between; gap: 8px; }
  .signals .sig b { color: var(--text); font-weight: 500; }
  .empty { color: var(--muted); font-style: italic; font-size: 12.5px; }
  footer { padding: 0 22px 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Engagement <span>— who's going dark</span></h1>
  <div class="totals" id="totals"></div>
  <div class="conn" id="conn"><span class="dot" style="background:var(--new)"></span>connecting…</div>
</header>
<div id="alerts"></div>
<main id="grid"></main>
<footer id="footer"></footer>
<script>
(() => {
  const COLORS = { active: '#3fb950', cooling: '#d29922', dark: '#f85149', new: '#6e7681' };
  const ORDER = { dark: 0, cooling: 1, new: 2, active: 3 };
  const SIGNAL_LABEL = {
    commit: 'commit', discord_message: 'discord msg',
    portal_login: 'portal login', checkin: 'check-in'
  };
  const grid = document.getElementById('grid');
  const totalsEl = document.getElementById('totals');
  const alertsEl = document.getElementById('alerts');
  const connEl = document.getElementById('conn');
  const footer = document.getElementById('footer');
  let recentAlerts = [];

  function ago(isoStr, nowMs) {
    if (!isoStr) return 'never';
    const s = Math.max(0, (nowMs - Date.parse(isoStr)) / 1000);
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return (s / 3600).toFixed(s < 7200 ? 1 : 0).replace(/\.0$/, '') + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }

  function sparkline(buckets, status) {
    const w = 130, h = 34, n = buckets.length;
    if (!n) return '';
    const max = Math.max(1, ...buckets.map(b => b.weight));
    const pts = buckets.map((b, i) => {
      const x = (i / (n - 1)) * (w - 2) + 1;
      const y = h - 2 - (b.weight / max) * (h - 6);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const color = COLORS[status] || COLORS.new;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" ' +
      'stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/></svg>';
  }

  function render(data) {
    const nowMs = Date.parse(data.generatedAt) || Date.now();
    const teams = [...data.teams].sort((a, b) =>
      (ORDER[a.status] - ORDER[b.status]) || (a.score - b.score));

    totalsEl.innerHTML = ['active', 'cooling', 'dark', 'new'].map(s =>
      '<span class="pill"><span class="dot" style="background:' + COLORS[s] + '"></span>' +
      '<b>' + (data.totals[s] || 0) + '</b>&nbsp;' + s + '</span>'
    ).join('');

    grid.innerHTML = teams.map(t => {
      const sigs = Object.entries(t.lastSeen)
        .sort((a, b) => Date.parse(b[1]) - Date.parse(a[1]))
        .slice(0, 4)
        .map(([type, at]) =>
          '<div class="sig"><span>last ' + (SIGNAL_LABEL[type] || type.replace(/_/g, ' ')) +
          '</span><b>' + ago(at, nowMs) + '</b></div>'
        ).join('');
      return '<div class="card ' + t.status + '">' +
        '<div class="card-top"><div class="team-name">' + escapeHtml(t.name) + '</div>' +
        '<div class="status-tag">' + t.status + '</div></div>' +
        '<div class="score-row"><div class="score">' + t.score.toFixed(1) +
        '<small>score</small></div>' +
        '<div class="spark">' + sparkline(t.sparkline, t.status) + '</div></div>' +
        '<div class="signals">' + (sigs || '<div class="empty">no activity yet</div>') + '</div>' +
        '</div>';
    }).join('');

    if (data.newAlerts && data.newAlerts.length) {
      recentAlerts = data.newAlerts.concat(recentAlerts).slice(0, 5);
    }
    const nameOf = id => (data.teams.find(t => t.id === id) || { name: id }).name;
    alertsEl.innerHTML = recentAlerts.map(a =>
      '<div class="alert"><b>' + escapeHtml(nameOf(a.team)) + '</b> went ' +
      a.from + ' &rarr; <b>' + a.to + '</b> (' + ago(a.at, Date.now()) + ')</div>'
    ).join('');

    footer.textContent = 'Updated ' + new Date(nowMs).toLocaleTimeString() +
      ' — score decays with a half-life; bands: active ≥ ' + data.thresholds.active +
      ', dark < ' + data.thresholds.dark + ' after ' + data.thresholds.darkAfterMinutes + 'm silence.';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function setConn(ok) {
    connEl.innerHTML = '<span class="dot" style="background:' +
      (ok ? COLORS.active : COLORS.dark) + '"></span>' + (ok ? 'live' : 'reconnecting…');
  }

  fetch('/api/teams').then(r => r.json()).then(render).catch(() => {});

  const es = new EventSource('/stream');
  for (const ev of ['snapshot', 'update', 'heartbeat']) {
    es.addEventListener(ev, e => { setConn(true); render(JSON.parse(e.data)); });
  }
  es.onerror = () => setConn(false);
  es.onopen = () => setConn(true);
})();
</script>
</body>
</html>
